[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-eng-signals"
version = "0.1.0"
description = "What works with coding agents: practitioner claims from Threads, checked against my own Claude Code and Codex sessions."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scikit-learn>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
signals = "ai_eng_signals.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
